[project]
name = "tiny-ledger"
version = "0.1.0"
description = "A tiny single-account ledger as a local FastAPI service. In-memory SQLite via SQLAlchemy. Records deposits and withdrawals; exposes current balance and transaction history. No persistence across restarts; no auth; no UI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
